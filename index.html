<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Morg</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 25px 20px 40px;
}

/* PROFILE */
.profile {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    padding: 5px 0 25px;
}

.profile-photo {
    position: relative;
    flex-shrink: 0;
}

.profile-photo img {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
}

.online-dot {
    position: absolute;
    right: 3px;
    bottom: 8px;
    width: 20px;
    height: 20px;
    background: #f2184b;
    border: 4px solid #fff;
    border-radius: 50%;
}

.profile-info {
    padding-top: 12px;
}

.profile-name {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.profile-name h1 {
    color: #182f91;
    font-size: 32px;
    font-weight: 800;
}

/* USA FLAG */
.flag {
    font-size: 31px;
    line-height: 1;
}

/* VERIFIED BADGE */
.verified {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 25px;
    height: 25px;
    background: #5146d9;
    color: #fff;
    border-radius: 50%;
    font-size: 16px;
    font-weight: 900;
    line-height: 1;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}

.stars {
    color: #ffb900;
    font-size: 30px;
    letter-spacing: 2px;
    margin-top: 7px;
}

.stats {
    display: flex;
    gap: 28px;
    margin-top: 7px;
}

.stat {
    color: #ed1680;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    align-items: center;
}

/* STAT ICONS */
.stat-icon {
    color: #172c91;
    margin-right: 7px;
    font-size: 25px;
    width: 28px;
    height: 25px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

/* BANNER */
.banner {
    text-align: center;
    margin: 5px 0 25px;
}

.banner img {
    width: 300px;
    max-width: 100%;
    height: auto;
    display: inline-block;
}

/* BUTTONS */
.buttons {
    max-width: 430px;
    margin: 0 auto 25px;
    display: flex;
    flex-direction: column;
    gap: 24px;
}

.buttons a {
    display: block;
    width: 100%;
    padding: 15px 20px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    background: #098dbd;
    border-radius: 35px;
    font-size: 20px;
    font-weight: bold;
}

.buttons a:hover {
    background: #087da8;
}

/* SLIDER */
.slider {
    width: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
}

.slider::-webkit-scrollbar {
    display: none;
}

.slide {
    min-width: 100%;
    flex-shrink: 0;
    scroll-snap-align: center;
    position: relative;
    overflow: hidden;
}

.slide img {
    width: 100%;
    height: auto;
    max-height: 850px;
    object-fit: cover;
    display: block;
}

/* EXPLICIT LABEL */
.explicit-label {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 17px 10px;
    background: rgba(0, 25, 35, 0.82);
    color: #ffd700;
    text-align: center;
    font-family: Georgia, serif;
    font-size: 42px;
}

/* DOTS */
.dots {
    text-align: center;
    margin: 15px 0 20px;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 5px;
    background: #999;
    border-radius: 50%;
}

/* CTA */
.cta {
    display: block;
    width: 100%;
    max-width: 430px;
    margin: 20px auto 0;
    padding: 15px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    background: #098dbd;
    border-radius: 35px;
    font-size: 19px;
    font-weight: bold;
}

/* FOOTER */
.footer {
    text-align: center;
    margin-top: 28px;
}

.footer a {
    display: inline-block;
    color: #555;
    border: 1px solid #ddd;
    border-radius: 25px;
    padding: 10px 22px;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
}

.footer p {
    color: #888;
    font-size: 11px;
    margin-top: 10px;
}

/* MOBILE */
@media (max-width: 600px) {

    .container {
        padding: 20px 0 35px;
    }

    .profile {
        padding: 0 20px 22px;
        gap: 15px;
    }

    .profile-photo img {
        width: 105px;
        height: 105px;
    }

    .online-dot {
        width: 18px;
        height: 18px;
        right: 0;
        bottom: 5px;
    }

    .profile-info {
        padding-top: 5px;
    }

    .profile-name {
        gap: 6px;
    }

    .profile-name h1 {
        font-size: 25px;
    }

    .flag {
        font-size: 24px;
    }

    .verified {
        width: 22px;
        height: 22px;
        font-size: 13px;
    }

    .stars {
        font-size: 25px;
        letter-spacing: 0;
    }

    .stats {
        gap: 15px;
    }

    .stat {
        font-size: 16px;
    }

    .stat-icon {
        font-size: 20px;
        width: 23px;
        height: 22px;
        margin-right: 5px;
    }

    .banner {
        margin-bottom: 24px;
    }

    .buttons {
        padding: 0 20px;
        gap: 24px;
        margin-bottom: 25px;
    }

    .buttons a {
        font-size: 18px;
        padding: 14px;
    }

    .slide img {
        max-height: none;
    }

    .explicit-label {
        font-size: 32px;
        padding: 12px 10px;
    }

    .cta {
        width: calc(100% - 40px);
    }
}
</style>

<!-- AUTO SCROLL -->
<script>

const slider = document.getElementById("slider");
const slides = document.querySelectorAll(".slide");

let currentSlide = 0;

setInterval(function() {

    currentSlide++;

    if (currentSlide >= slides.length) {
        currentSlide = 0;
    }

    slider.scrollTo({
        left: currentSlide * slider.clientWidth,
        behavior: "smooth"
    });

}, 3000);

</script>
