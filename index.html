<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Morg</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #09090c;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 22px 12px 40px;
}

/* PROFILE */
.profile {
    text-align: center;
    padding: 10px 0 20px;
}

.profile img {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
}

.profile h1 {
    font-size: 28px;
    margin-top: 12px;
}

.stats {
    color: #999;
    font-size: 14px;
    margin-top: 7px;
}

/* BUTTONS */
.buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

.buttons a {
    flex: 1;
    padding: 12px 5px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    background: #222229;
    border: 1px solid #38383f;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
}

/* SLIDER */
.slider {
    width: 100%;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    border-radius: 12px;
}

.slider::-webkit-scrollbar {
    display: none;
}

.slide {
    min-width: 100%;
    scroll-snap-align: center;
    border-radius: 12px;
    overflow: hidden;
    background: #15151b;
}

.slide img {
    width: 100%;
    height: auto;
    display: block;
}

/* DOTS */
.dots {
    text-align: center;
    margin: 12px 0 20px;
}

.dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin: 0 4px;
    background: #777;
    border-radius: 50%;
}

/* CTA */
.cta {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    text-align: center;
    text-decoration: none;
    color: #111;
    background: #fff;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
}

/* FOOTER */
.footer {
    text-align: center;
    margin-top: 25px;
}

.footer a {
    color: #777;
    text-decoration: none;
    font-size: 12px;
}

.footer p {
    color: #555;
    font-size: 11px;
    margin-top: 8px;
}

/* MOBILE */
@media (max-width: 480px) {
    .container {
        padding-left: 10px;
        padding-right: 10px;
    }

    .profile img {
        width: 95px;
        height: 95px;
    }

    .profile h1 {
        font-size: 25px;
    }

    .buttons a {
        font-size: 12px;
        padding: 12px 4px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- PROFILE -->
    <div class="profile">

        <img src="images/profile.png" alt="Morg">

        <h1>Morg</h1>

        <div class="stats">
            88 Videos &nbsp; • &nbsp; 298 Photos
        </div>

    </div>


    <!-- TOP BUTTONS -->
    <div class="buttons">

        <a href="#slider">
            +18 Livestream
        </a>

        <a href="#slider">
            Exclusive Content
        </a>

    </div>


    <!-- PHOTO SLIDER -->
    <div class="slider" id="slider">

        <div class="slide">
            <img src="images/Selider1.jpeg" alt="Morg">
        </div>

        <div class="slide">
            <img src="images/Selider2.jpeg" alt="Morg">
        </div>

        <div class="slide">
            <img src="images/Selider3.jpeg" alt="Morg">
        </div>

    </div>


    <!-- SLIDER DOTS -->
    <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>


    <!-- AFFILIATE BUTTON -->
    <a
        class="cta"
        href="YOUR-AFFILIATE-LINK"
        target="_blank"
        rel="noopener noreferrer">
        Visit Now
    </a>


    <!-- FOOTER -->
    <div class="footer">

        <a href="#">
            DMCA
        </a>

        <p>
            © 2026 Morg. All rights reserved.
        </p>

    </div>

</div>

</body>
</html>
