<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Morg</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff;
    color: #222;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 1300px;
    margin: auto;
    padding: 35px 30px 45px;
}


/* =========================
   PROFILE
========================= */

.profile {
    display: flex;
    align-items: flex-start;
    gap: 26px;
    padding: 0 0 45px;
}

.profile-photo {
    position: relative;
    flex-shrink: 0;
}

.profile-photo img {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
}

.online-dot {
    position: absolute;
    right: 4px;
    bottom: 13px;
    width: 25px;
    height: 25px;
    background: #ef1749;
    border: 5px solid #fff;
    border-radius: 50%;
}


/* PROFILE INFO */

.profile-info {
    padding-top: 24px;
}

.profile-name {
    display: flex;
    align-items: center;
    gap: 15px;
    white-space: nowrap;
}

.profile-name h1 {
    color: #203895;
    font-size: 48px;
    line-height: 1;
    font-weight: 800;
}


/* =========================
   USA FLAG
========================= */

.flag {
    position: relative;
    width: 60px;
    height: 42px;
    overflow: hidden;
    border-radius: 2px;
    box-shadow: 0 0 2px rgba(0,0,0,0.25);
    background:
        repeating-linear-gradient(
            to bottom,
            #b22234 0px,
            #b22234 3.23px,
            #fff 3.23px,
            #fff 6.46px
        );
}

.flag::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 25px;
    height: 23px;
    background: #3c3b6e;
}

.flag::after {
    content: "••••••••••••••••••••••••";
    position: absolute;
    left: 3px;
    top: 1px;
    width: 20px;
    height: 20px;
    color: #fff;
    font-size: 4px;
    line-height: 5px;
    letter-spacing: 1px;
    word-spacing: 1px;
}


/* =========================
   VERIFIED CIRCLE
========================= */

.verified {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    width: 38px;
    height: 38px;

    background: #5146d9;
    color: #fff;

    border-radius: 50%;

    font-size: 24px;
    font-weight: 900;
    line-height: 1;

    flex-shrink: 0;
}


/* =========================
   STARS
========================= */

.stars {
    color: #ffb900;
    font-size: 44px;
    letter-spacing: 4px;
    line-height: 1;
    margin-top: 18px;
}


/* =========================
   STATS
========================= */

.stats {
    display: flex;
    align-items: center;
    gap: 50px;
    margin-top: 19px;
}

.stat {
    color: #d92382;
    font-size: 28px;
    font-weight: 700;

    display: flex;
    align-items: center;
    white-space: nowrap;
}


/* VIDEO ICON */

.video-icon {
    width: 39px;
    height: 39px;
    margin-right: 14px;

    border: 4px solid #20358f;
    border-radius: 2px;

    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.video-icon::before {
    content: "";
    position: absolute;
    left: 8px;
    top: 9px;

    width: 0;
    height: 0;

    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 11px solid #20358f;
}

.video-icon::after {
    content: "";
    position: absolute;
    top: -4px;
    left: 7px;

    width: 22px;
    height: 4px;

    background: #20358f;

    box-shadow:
        0 35px 0 #20358f;
}


/* PHOTO ICON */

.photo-icon {
    width: 39px;
    height: 39px;
    margin-right: 14px;

    border: 4px solid #20358f;
    position: relative;

    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.photo-icon::before {
    content: "";
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;
    background: #20358f;

    top: 5px;
    right: 5px;
}

.photo-icon::after {
    content: "";
    position: absolute;

    width: 22px;
    height: 13px;

    border-left: 4px solid #20358f;
    border-top: 4px solid #20358f;

    transform: rotate(45deg);

    bottom: 4px;
    left: 7px;
}


/* =========================
   BANNER
========================= */

.banner {
    text-align: center;
    margin: 0 0 35px;
}

.banner img {
    width: 740px;
    max-width: 100%;
    height: auto;
    display: inline-block;
}


/* =========================
   BUTTONS
========================= */

.buttons {
    width: 100%;
    max-width: 620px;

    margin: 0 auto 35px;

    display: flex;
    flex-direction: column;
    gap: 22px;
}

.buttons a {
    display: block;

    width: 100%;

    padding: 17px 20px;

    text-align: center;
    text-decoration: none;

    color: #fff;
    background: #098dbd;

    border-radius: 35px;

    font-size: 23px;
    font-weight: bold;
}

.buttons a:hover {
    background: #087da8;
}


/* =========================
   SLIDER
========================= */

.slider {
    width: 100%;

    display: flex;

    overflow-x: auto;

    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;

    scrollbar-width: none;
}

.slider::-webkit-scrollbar {
    display: none;
}

.slide {
    min-width: 100%;
    flex-shrink: 0;

    scroll-snap-align: center;

    position: relative;

    overflow: hidden;
}

.slide img {
    width: 100%;
    height: auto;

    max-height: 850px;

    object-fit: cover;

    display: block;
}


/* =========================
   EXPLICIT LABEL
========================= */

.explicit-label {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 17px 10px;

    background: rgba(0, 25, 35, 0.82);

    color: #ffd700;

    text-align: center;

    font-family: Georgia, serif;

    font-size: 42px;
}


/* =========================
   DOTS
========================= */

.dots {
    text-align: center;
    margin: 15px 0 20px;
}

.dot {
    display: inline-block;

    width: 8px;
    height: 8px;

    margin: 0 5px;

    background: #999;

    border-radius: 50%;
}


/* =========================
   CTA
========================= */

.cta {
    display: block;

    width: 100%;
    max-width: 620px;

    margin: 20px auto 0;

    padding: 17px;

    text-align: center;
    text-decoration: none;

    color: #fff;
    background: #098dbd;

    border-radius: 35px;

    font-size: 21px;
    font-weight: bold;
}


/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    margin-top: 30px;
}

.footer a {
    display: inline-block;

    color: #555;

    border: 1px solid #ddd;
    border-radius: 25px;

    padding: 10px 22px;

    text-decoration: none;

    font-size: 14px;
    font-weight: bold;
}

.footer p {
    color: #888;
    font-size: 11px;
    margin-top: 10px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .container {
        padding: 20px 0 35px;
    }

    .profile {
        padding: 0 20px 30px;
        gap: 15px;
    }

    .profile-photo img {
        width: 105px;
        height: 105px;
    }

    .online-dot {
        width: 18px;
        height: 18px;
        right: 0;
        bottom: 5px;
        border-width: 4px;
    }

    .profile-info {
        padding-top: 5px;
    }

    .profile-name {
        gap: 7px;
    }

    .profile-name h1 {
        font-size: 27px;
    }

    .flag {
        width: 38px;
        height: 27px;
    }

    .flag::before {
        width: 16px;
        height: 15px;
    }

    .flag::after {
        left: 2px;
        top: 0;
        width: 13px;
        font-size: 3px;
        line-height: 3.5px;
    }

    .verified {
        width: 27px;
        height: 27px;
        font-size: 17px;
    }

    .stars {
        font-size: 27px;
        letter-spacing: 1px;
        margin-top: 9px;
    }

    .stats {
        gap: 18px;
        margin-top: 10px;
        flex-wrap: wrap;
    }

    .stat {
        font-size: 17px;
    }

    .video-icon,
    .photo-icon {
        width: 25px;
        height: 25px;
        border-width: 2px;
        margin-right: 6px;
    }

    .video-icon::before {
        left: 6px;
        top: 5px;
        border-top-width: 5px;
        border-bottom-width: 5px;
        border-left-width: 8px;
    }

    .video-icon::after {
        top: -2px;
        left: 5px;
        width: 12px;
        height: 2px;
        box-shadow: 0 23px 0 #20358f;
    }

    .photo-icon::before {
        width: 5px;
        height: 5px;
        top: 3px;
        right: 3px;
    }

    .photo-icon::after {
        width: 14px;
        height: 8px;
        border-left-width: 2px;
        border-top-width: 2px;
        bottom: 2px;
        left: 4px;
    }

    .banner {
        margin-bottom: 25px;
    }

    .banner img {
        width: 100%;
        max-width: 740px;
    }

    .buttons {
        padding: 0 20px;
        gap: 18px;
        margin-bottom: 25px;
    }

    .buttons a {
        font-size: 18px;
        padding: 14px;
    }

    .slide img {
        max-height: none;
    }

    .explicit-label {
        font-size: 32px;
        padding: 12px 10px;
    }

    .cta {
        width: calc(100% - 40px);
        font-size: 18px;
    }
}

</style>
